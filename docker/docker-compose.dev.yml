services:
  postgres:
    image: postgres:16
    container_name: iqmeridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iqmeridian
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: iqmeridian-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: iqmeridian-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
  psychometrics:
    build:
      context: ../apps/psychometrics
      dockerfile: Dockerfile
    container_name: iqmeridian-psychometrics
    restart: unless-stopped
    environment:
      PSYCHOMETRICS_ENVIRONMENT: development
      PSYCHOMETRICS_SERVICE_VERSION: 0.1.0
      PSYCHOMETRICS_PORT: 8001
      PSYCHOMETRICS_INTERNAL_SERVICE_TOKEN: dev-psychometrics-token
      PSYCHOMETRICS_DATA_ACCESS_MODE: nestjs_orchestrated
      PSYCHOMETRICS_INTERNAL_API_URL: http://api:3001
      PSYCHOMETRICS_OUTPUT_MODE: return_to_nestjs
    expose:
      - '8001'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import os, urllib.request; req=urllib.request.Request("http://127.0.0.1:8001/health", headers={"x-internal-service-token": os.environ.get("PSYCHOMETRICS_INTERNAL_SERVICE_TOKEN", "")}); urllib.request.urlopen(req, timeout=5).read()',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  minio_data:
